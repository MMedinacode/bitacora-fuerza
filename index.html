<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora de Fuerza</title>
<meta name="description" content="Tu bitácora de gimnasio: rutinas por día, series, descansos y progreso.">
<meta name="theme-color" content="#1B4ED1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx. 560 px) con tres pestañas fijas abajo (Hoy, Semana, Progreso), el descanso
   pegado encima y una hoja inferior para la biblioteca. Acentos de los discos olímpicos: azul 20 kg, rojo 25 kg,
   verde 10 kg, amarillo 15 kg. */
:root{
  --bg:#E8ECF0;--surface:#FFFFFF;--surface-2:#F2F5F8;--ink:#12161B;--ink-2:#47525E;--ink-3:#6B7682;--line:#D2D9E0;
  --accent:#1B4ED1;--accent-soft:#DFE7FC;--accent-ink:#FFFFFF;
  --record:#C21F37;--record-soft:#FBE1E5;--record-ink:#FFFFFF;--ok:#1D7A46;--ok-soft:#DBF0E3;--ok-ink:#FFFFFF;--warn:#865F00;--warn-soft:#FAEFCC;
  --plate-25:#CF2338;--plate-20:#1B4ED1;--plate-15:#EDB824;--plate-10:#2A9A58;--plate-5:#FBFBFB;--plate-2:#CF2338;--plate-1:#AAB3BC;--plate-edge:rgba(18,22,27,.3);
  --scrim:rgba(10,12,15,.45);--shadow:0 8px 24px rgba(18,22,27,.16);
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;--r-sm:10px;--tab-h:62px;--timer-h:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1114;--surface:#161A1F;--surface-2:#1D2228;--ink:#E7EAEE;--ink-2:#A6B0BA;--ink-3:#7F8A95;--line:#29303A;
  --accent:#7894FF;--accent-soft:#1B2545;--accent-ink:#0A0E1A;
  --record:#FF6676;--record-soft:#3A1A21;--record-ink:#1A0508;--ok:#52C487;--ok-soft:#14301F;--ok-ink:#06140B;--warn:#F1C649;--warn-soft:#332A10;
  --plate-5:#E4E8EC;--plate-1:#7E8892;--plate-edge:rgba(255,255,255,.22);
  --scrim:rgba(0,0,0,.6);--shadow:0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1114;--surface:#161A1F;--surface-2:#1D2228;--ink:#E7EAEE;--ink-2:#A6B0BA;--ink-3:#7F8A95;--line:#29303A;
  --accent:#7894FF;--accent-soft:#1B2545;--accent-ink:#0A0E1A;
  --record:#FF6676;--record-soft:#3A1A21;--record-ink:#1A0508;--ok:#52C487;--ok-soft:#14301F;--ok-ink:#06140B;--warn:#F1C649;--warn-soft:#332A10;
  --plate-5:#E4E8EC;--plate-1:#7E8892;--plate-edge:rgba(255,255,255,.22);
  --scrim:rgba(0,0,0,.6);--shadow:0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:14px calc(var(--tab-h) + var(--timer-h) + 48px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.08;text-wrap:balance}
h2{font-size:28px;font-weight:700}
h3{font-size:21px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.cap::first-letter{text-transform:uppercase}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:600}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.section-head{display:grid;gap:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
input,select{font:inherit;color:var(--ink)}
.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.02em;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--record);border-color:var(--record);color:var(--record-ink)}
.btn.link{border:0;background:none;min-height:40px;padding:0 4px;color:var(--accent);font-size:17px;justify-self:start}
.btn.small{min-height:38px;padding:0 14px;font-size:16px}
.btn.big{min-height:56px;font-size:21px;width:100%}
.icon-btn{flex:none;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:17px;display:inline-grid;place-items:center;color:var(--ink-2)}

/* Encabezado y semana */
.top{display:grid;gap:10px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.semana{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sem-izq{display:grid;gap:6px;justify-items:start}
.sem-num{display:flex;align-items:baseline;gap:4px}
.sem-num .big{font-size:44px;font-weight:700;line-height:.9}
.sem-num .de{font-size:21px;color:var(--ink-3)}
.dias{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dia{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--ink-3);font-weight:600}
.disco{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dia.plan .disco{border-color:var(--accent)}
.dia.descanso .disco{border-style:dotted}
.dia.on .disco{border-color:var(--accent);background:radial-gradient(circle,var(--surface) 0 3px,var(--accent) 3.5px)}
.dia.hoy .dl{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-extra{background:var(--accent-soft);color:var(--accent)}
.pill-casi{background:var(--warn-soft);color:var(--warn)}
.pill-falta{background:var(--surface-2);color:var(--ink-2)}
.volver{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);border:0;font-weight:600;width:100%;text-align:left}
.aviso{padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:15px}
.cargando{padding:24px 0;text-align:center}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card.destacada{border-color:var(--accent);border-width:2px}
.card>header{display:grid;gap:2px}
.vacio p{color:var(--ink-2);max-width:60ch}
.pasos{margin:0;padding-left:22px;display:grid;gap:6px;color:var(--ink-2)}
.ej-lista{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.ej-lista li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0}
.ej-lista li:last-child{border-bottom:0}
.ej-lista .num{color:var(--ink-2);white-space:nowrap}

/* Semana y editor de día */
.dias-plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dia-btn{width:100%;display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:66px}
.dia-btn.hoy{border-color:var(--accent);border-width:2px}
.dia-n{font-family:var(--font-display);font-weight:700;font-size:20px}
.dia-r{display:grid;min-width:0}
.dia-r b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dia-r small{color:var(--ink-2);font-size:13px}
.chev{color:var(--ink-3);font-size:24px;line-height:1}
.txt,select{min-width:0;min-height:46px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 12px;font-size:16px}
.txt{width:100%}
.picker{display:grid;gap:8px}
.picker .row{flex-wrap:nowrap}
.picker select{flex:1}
.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item-top b{font-weight:600}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.cfg{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.mini-step{display:inline-grid;grid-template-columns:36px 40px 36px;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.mini-step button{border:0;background:transparent;height:36px;font-size:19px;color:var(--ink)}
.mini-step .num{text-align:center;font-size:19px;color:var(--ink)}
.mini select{min-height:36px;padding:0 8px;font-size:15px;border-radius:8px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.sin-dia{display:grid;gap:8px}

/* Sesión */
.sesion-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sesion-prog{color:var(--ink-2)}
.sesion-prog .num{font-size:22px;color:var(--ink)}
.card .ej-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .ej-head>div{min-width:0}
.sug{font-size:15px;padding:8px 12px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2)}
.sug-sube{background:var(--ok-soft);color:var(--ok)}
.sug-baja{background:var(--warn-soft);color:var(--warn)}
.menu-ej{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:var(--r-sm);background:var(--surface-2)}
.series{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) 72px 60px 46px;gap:6px;align-items:center;padding:3px 4px;border-radius:var(--r-sm)}
.srow.shead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-block:0}
.srow.shead span:nth-child(n+3){text-align:center}
.srow.hecha{background:var(--ok-soft)}
.srow.rec{background:var(--record-soft)}
.sn{font-family:var(--font-display);font-weight:700;color:var(--ink-3);text-align:center;font-size:17px}
.srow.rec .sn{color:var(--record);font-size:13px;letter-spacing:.04em}
.prev{border:0;background:none;text-align:left;color:var(--ink-3);font-size:14px;min-height:44px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font-family:var(--font-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 4px}
.srow.hecha .cell,.srow.rec .cell{background:transparent;border-color:transparent}
.check{width:46px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--ink-3)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.discos{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:40px;color:var(--ink-2)}
.plates{display:inline-flex;align-items:center;gap:2px;height:48px}
.sleeve{width:18px;height:8px;border-radius:2px;background:var(--plate-1)}
.plate{width:10px;height:var(--h);border-radius:3px;background:var(--c);border:1px solid var(--plate-edge)}
.fin{display:grid;gap:10px}
.fin p{color:var(--ink-2)}

/* Progreso */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;align-content:space-between;min-width:0}
.kpi .eyebrow{font-size:11px;line-height:1.25}
.kpi-v{font-size:34px;font-weight:700;line-height:1}
.kpi-v small{font-size:18px;color:var(--ink-3)}
.kpi-v.rec{color:var(--record)}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--ink-3);font:500 10px var(--font-body)}
.chart .val{fill:var(--ink);font:700 13px var(--font-display)}
.chart .meta-t{fill:var(--accent);font:600 10px var(--font-body)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--ink-2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.lg{width:10px;height:10px;border-radius:2px}
.lg-ok{background:var(--ok)}.lg-casi{background:var(--warn)}.lg-bajo{background:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabla-wrap{overflow-x:auto}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tabla td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tabla tr:last-child td{border-bottom:0}
.tabla .r{text-align:right}
.tabla td.num{font-size:16px;font-weight:600}
.historial{list-style:none;margin:0;padding:0;display:grid}
.hist{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist-btn{border:0;background:none;text-align:left;padding:0;display:grid;gap:2px;min-width:0;flex:1}

/* Ajustes */
.ajuste{display:grid;gap:6px}
.ajuste>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-btn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink)}
.seg-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Hoja inferior (biblioteca y elegir rutina) */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);border:0;width:100%}
.sheet{position:relative;max-height:90%;width:100%;max-width:560px;margin-inline:auto;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:10px;padding:16px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-body{overflow-y:auto;min-height:0;flex:1;display:grid;align-content:start;gap:10px}
.lib-lista{list-style:none;margin:0;padding:0;display:grid;align-content:start}
.lib-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 26px;gap:10px;align-items:center;text-align:left;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;min-height:54px;color:var(--ink)}
.lib-row small{display:block;color:var(--ink-2);font-size:13px}
.lib-row[aria-pressed="true"]{background:var(--accent-soft)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.lib-row[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lib-row:disabled{opacity:.55}
.sheet-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.elegir{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.elegir button{width:100%;text-align:left;display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink)}
.elegir small{color:var(--ink-2)}
.form-crear{display:grid;gap:10px}

/* Barra inferior, descanso y avisos */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-inner{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h)}
.tab{display:grid;place-items:center;align-content:center;gap:2px;background:none;border:0;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--ink-3)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.timer{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);border-top:1px solid var(--line)}
.timer-inner{max-width:560px;margin-inline:auto;padding:10px 16px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.timer-txt{display:flex;align-items:baseline;gap:10px;min-width:0}
.timer-num{font-size:32px;font-weight:700;line-height:1}
.timer-btns{display:flex;gap:6px}
.timer-bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
#timer-fill{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.timer.listo #timer-fill{background:var(--ok)}
.timer.listo .timer-num{color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--timer-h) + 12px + env(safe-area-inset-bottom,0px));z-index:50;width:min(528px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:var(--r-sm);padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow);font-weight:500}
.toast-record{background:var(--record);color:var(--record-ink)}
.toast .btn{background:transparent;border-color:currentColor;color:inherit;flex:none}
.txt[readonly]{font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top" id="top"></header>
  <div class="aviso" id="aviso" role="status" hidden></div>
  <main id="vista"><p class="muted cargando">Cargando tu bitácora…</p></main>
</div>

<script>
(() => {
'use strict';

/* ================= Constantes ================= */

/* Biblioteca: [id, nombre, músculo, tipo] */

  ['l-peso-muerto-rumano', 'Peso muerto rumano', 'piernas', 'barra'], ['l-peso-muerto-sumo', 'Peso muerto sumo', 'piernas', 'barra'],

  ['l-step-up', 'Subida al cajón (step-up)', 'piernas', 'mancuernas'], ['l-extension-cuadriceps', 'Extensión de cuádriceps', 'piernas', 'maquina'],
  ['l-curl-femoral', 'Curl femoral', 'piernas', 'maquina'], ['l-gemelos-pie', 'Elevación de talones de pie', 'piernas', 'maquina'],
  ['l-gemelos-sentado', 'Elevación de talones sentado', 'piernas', 'maquina'], ['l-abductores', 'Abductores en máquina', 'piernas', 'maquina'],

  ['l-press-militar', 'Press militar', 'hombros', 'barra'], ['l-press-hombro-mancuernas', 'Press de hombros con mancuernas', 'hombros', 'mancuernas'],

  ['l-frontales', 'Elevaciones frontales', 'hombros', 'mancuernas'], ['l-pajaros', 'Pájaros (vuelos posteriores)', 'hombros', 'mancuernas'],

  ['l-encogimientos', 'Encogimientos (trapecio)', 'hombros', 'mancuernas'],
  ['l-curl-barra', 'Curl con barra', 'brazos', 'barra'], ['l-curl-mancuernas', 'Curl con mancuernas', 'brazos', 'mancuernas'],
  ['l-curl-martillo', 'Curl martillo', 'brazos', 'mancuernas'], ['l-curl-predicador', 'Curl predicador', 'brazos', 'barra'],
  ['l-curl-polea', 'Curl en polea', 'brazos', 'maquina'], ['l-curl-concentrado', 'Curl concentrado', 'brazos', 'mancuernas'],
  ['l-press-frances', 'Press francés', 'brazos', 'barra'], ['l-triceps-polea', 'Extensión de tríceps en polea', 'brazos', 'maquina'],
  ['l-triceps-cuerda', 'Tríceps con cuerda', 'brazos', 'maquina'], ['l-triceps-sobre-cabeza', 'Extensión de tríceps sobre la cabeza', 'brazos', 'mancuernas'],
  ['l-press-cerrado', 'Press banca agarre cerrado', 'brazos', 'barra'], ['l-fondos-banco', 'Fondos en banco', 'brazos', 'corporal'],
  ['l-patada-triceps', 'Patada de tríceps', 'brazos', 'mancuernas'], ['l-antebrazo', 'Curl de muñeca', 'brazos', 'barra'],
  ['l-plancha', 'Plancha', 'core', 'tiempo'], ['l-plancha-lateral', 'Plancha lateral', 'core', 'tiempo'],
  ['l-crunch', 'Crunch abdominal', 'core', 'corporal'], ['l-crunch-polea', 'Crunch en polea', 'core', 'maquina'],
  ['l-elevacion-piernas', 'Elevación de piernas colgado', 'core', 'corporal'], ['l-rueda', 'Rueda abdominal', 'core', 'corporal'],
  ['l-russian-twist', 'Russian twist', 'core', 'corporal'], ['l-pallof', 'Press Pallof', 'core', 'maquina'],
  ['l-cinta', 'Trotar en cinta', 'cardio', 'cardio'], ['l-caminata-inclinada', 'Caminata inclinada', 'cardio', 'cardio'],
  ['l-bicicleta', 'Bicicleta estática', 'cardio', 'cardio'], ['l-eliptica', 'Elíptica', 'cardio', 'cardio'],
  ['l-remo-ergometro', 'Remo ergómetro', 'cardio', 'cardio'], ['l-escaladora', 'Escaladora', 'cardio', 'cardio'],
  ['l-cuerda', 'Saltar la cuerda', 'cardio', 'cardio'],
  ['l-cargada', 'Cargada (clean)', 'otro', 'barra'], ['l-arranque', 'Arranque (snatch)', 'otro', 'barra'],
  ['l-swing', 'Swing con kettlebell', 'otro', 'mancuernas'], ['l-farmer', 'Caminata del granjero', 'otro', 'mancuernas'],
  ['l-burpees', 'Burpees', 'otro', 'corporal'],
];
const LIB_MAP = new Map(LIB.map(([id, nombre, musculo, tipo]) => [id, { id, nombre, musculo, tipo }]));

/* ================= Estado ================= */
const S = {
  db: null, sinDb: false, soloLectura: false,
  cargado: { ejercicios: false, rutinas: false, sesiones: false, plan: false },
  ejercicios: new Map(), rutinasRaw: new Map(), sesionesRaw: [], planRaw: null, ajustes: { ...DEFAULTS },
  tab: 'hoy', vista: null, sheet: null, sheetDirty: false, confirm: null, menuEj: null, abierta: null, progEj: null,
  timer: null, toast: null, ver: 0,
};

/* ================= Utilidades ================= */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 2 });
const kg = (n) => nf.format(Math.round((Number(n) || 0) * 100) / 100);
const hoyISO = () => new Date().toLocaleDateString('sv-SE');
const dParse = (iso) => { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fCorta = (iso) => dParse(iso).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' }).replace('.', '');
const fLarga = (iso) => dParse(iso).toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
const lunesDe = (iso) => { const d = dParse(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toLocaleDateString('sv-SE'); };
const sumarDias = (iso, n) => { const d = dParse(iso); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const diaIdx = (iso) => (dParse(iso).getDay() + 6) % 7;
const e1rm = (peso, reps) => (reps <= 1 ? peso : peso * (1 + reps / 30));
const nuevoId = (p) => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const porNombre = (a, b) => a.nombre.localeCompare(b.nombre, 'es');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const numero = (v) => { const s = String(v ?? '').trim().replace(',', '.'); if (s === '') return null; const n = Number(s); return Number.isFinite(n) ? n : null; };
const fmtIn = (n) => (n === null || n === undefined || n === '' ? '' : String(Math.round(Number(n) * 100) / 100).replace('.', ','));
const mmss = (v) => `${Math.floor(v / 60)}:${String(v % 60).padStart(2, '0')}`;
const clonar = (o) => JSON.parse(JSON.stringify(o));
const sinTildes = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function guardarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento local */ } }
function leerLocal(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function defInc(tipo, musculo) {
  if (tipo === 'barra') return musculo === 'piernas' || musculo === 'espalda' ? 5 : 2.5;
  if (tipo === 'mancuernas') return 2;
  if (tipo === 'maquina') return ['hombros', 'brazos', 'core'].includes(musculo) ? 2.5 : 5;
  if (tipo === 'corporal') return 2.5;
  return 0;
}

/* ================= Cambios pendientes (se ven al tiro, se guardan después) ================= */
const pend = new Map();
const timers = new Map();
function bump() { S.ver++; }
function setPend(key, patch) {
  const cur = pend.get(key) || { data: {}, gen: 0 };
  const next = { data: { ...cur.data, ...patch }, gen: cur.gen + 1, confirmado: false };
  pend.set(key, next); bump();
  return next.gen;
}
function finPend(key, gen, ok) {
  const cur = pend.get(key);
  if (!cur) return;
  if (!ok) { pend.delete(key); bump(); render(); return; }
  if (cur.gen === gen) cur.confirmado = true;
}
function limpiarPend(prefijo) {
  let cambio = false;
  for (const [k, v] of pend) if (k.startsWith(prefijo) && v.confirmado) { pend.delete(k); cambio = true; }
  if (cambio) bump();
}
const conPend = (col, id, base) => { const p = pend.get(col + '/' + id); return p ? { ...base, ...p.data } : base; };
function guardarLuego(key, fn, ms) { clearTimeout(timers.get(key)); timers.set(key, setTimeout(() => { timers.delete(key); fn(); }, ms)); }

const colas = new Map();
function enCola(path, fn) {
  const prev = colas.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  colas.set(path, next);
  return next;
}
function escribir(path, fn) {
  if (!S.db) { toast('No hay conexión con el guardado de la bitácora.'); return Promise.resolve(false); }
  return enCola(path, async () => {
    try { await fn(); return true; }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await sleep(400 + Math.random() * 600);
        try { await fn(); return true; } catch (e2) { errorEscritura(e2); return false; }
      }
      errorEscritura(e);
      return false;
    }
  });
}
function errorEscritura(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') { S.soloLectura = true; toast('No se pudo guardar: esta bitácora solo la puede editar su dueño.'); }
  else if (c === 'quota_exceeded') toast('Se llenó el espacio de la bitácora. Borra entrenamientos antiguos para seguir.');
  else if (c === 'resource_exhausted') toast('Muchas acciones seguidas. Espera unos segundos e intenta de nuevo.');
  else toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
  render();
}
async function escribirPend(key) {
  const p = pend.get(key);
  if (!p) return;
  const g = p.gen, data = clonar(p.data);
  const ok = await escribir(key, () => S.db.doc(key).update(data));
  finPend(key, g, ok);
}

/* ================= Lectura de datos ================= */
function infoEj(id) {
  const c = S.ejercicios.get(id);
  if (c) {
    const tipo = TIPOS[c.tipo] ? c.tipo : (c.barra ? 'barra' : 'maquina');
    const musculo = MUSCULO_NOMBRE[c.musculo] ? c.musculo : (c.zona === 'inferior' ? 'piernas' : 'otro');
    return { id, nombre: c.nombre || 'Ejercicio', tipo, musculo, inc: typeof c.inc === 'number' ? c.inc : defInc(tipo, musculo), propio: true };
  }
  const l = LIB_MAP.get(id);
  if (l) return { ...l, inc: defInc(l.tipo, l.musculo), propio: false };
  return { id, nombre: 'Ejercicio', tipo: 'maquina', musculo: 'otro', inc: 2.5, propio: false };
}
function itemDefault(ej) { const t = infoEj(ej).tipo; return { ej, series: DEF[t].series, reps: DEF[t].reps, descanso: DEF[t].descanso }; }
function normRutina(id, d) {
  const items = Array.isArray(d.items) ? d.items : (Array.isArray(d.ejercicios) ? d.ejercicios.map(itemDefault) : []);
  return {
    id, nombre: d.nombre || 'Rutina', orden: d.orden || 0,
    items: items.map((it) => { const t = infoEj(it.ej).tipo; return { ej: it.ej, series: it.series || DEF[t].series, reps: it.reps || DEF[t].reps, descanso: typeof it.descanso === 'number' ? it.descanso : DEF[t].descanso }; }),
  };
}
function rutinaDe(id) { const raw = id && S.rutinasRaw.get(id); return raw ? normRutina(id, conPend('rutinas', id, raw)) : null; }
function rutinasTodas() { return [...S.rutinasRaw.keys()].map(rutinaDe).filter(Boolean).sort((a, b) => a.orden - b.orden); }
function planDias() {
  const d = conPend('plan', 'semana', S.planRaw || {});
  const dias = Array.isArray(d.dias) ? d.dias.slice(0, 7) : [];
  while (dias.length < 7) dias.push(null);
  return dias.map((x) => (x === 'descanso' ? 'descanso' : (x && S.rutinasRaw.has(x) ? x : null)));
}
const diasDeRutina = (rid) => planDias().map((x, i) => (x === rid ? i : -1)).filter((i) => i >= 0);

function normSesion(id, d) {
  let items = Array.isArray(d.items) ? d.items : null;
  if (!items) {
    const ids = Array.isArray(d.ejercicios) ? d.ejercicios : [], ser = Array.isArray(d.series) ? d.series : [];
    const extra = [...new Set(ser.map((x) => x.ej))].filter((e) => !ids.includes(e));
    items = [...ids, ...extra].map((ej) => ({ ej, series: ser.filter((x) => x.ej === ej).map((x) => ({ peso: x.peso, reps: x.reps, hecho: true, t: x.t })) }));
  }
  return {
    id, fecha: d.fecha, inicio: d.inicio || '', fin: d.fin || null, estado: d.estado || 'terminada',
    rutinaId: d.rutinaId || null, rutinaNombre: d.rutinaNombre || 'Entrenamiento',
    items: items.map((it) => ({ ...it, meta: it.meta ?? null, descanso: it.descanso ?? null, series: Array.isArray(it.series) ? it.series : [] })),
  };
}
let cacheSes = [], cacheVer = -1;
function getSesiones() {
  if (cacheVer !== S.ver) { cacheSes = S.sesionesRaw.map((raw) => normSesion(raw.id, conPend('sesiones', raw.id, raw))); cacheVer = S.ver; }
  return cacheSes;
}
const sesionActiva = () => getSesiones().find((s) => s.estado === 'en_curso') || null;
const hechasDe = (s) => s.items.reduce((n, it) => n + it.series.filter((x) => x.hecho).length, 0);
const totalDe = (s) => s.items.reduce((n, it) => n + it.series.length, 0);

/* ================= Cálculos ================= */
function metrica(info, x) {
  const p = Number(x.peso) || 0, r = Number(x.reps) || 0;
  if (info.tipo === 'barra' || info.tipo === 'mancuernas' || info.tipo === 'maquina') return e1rm(p, r);
  if (info.tipo === 'corporal') return p > 0 ? e1rm(p, r) : r;
  if (info.tipo === 'tiempo') return r;
  return 0;
}
function fmtSet(info, x) {
  const p = Number(x.peso) || 0, r = Number(x.reps) || 0;
  if (info.tipo === 'tiempo') return `${r} s`;
  if (info.tipo === 'cardio') return `${r} min${p ? ` · ${kg(p)} km` : ''}`;
  if (info.tipo === 'corporal') return p > 0 ? `+${kg(p)}×${r}` : `${r} reps`;
  return `${kg(p)}×${r}`;
}
function historial(ejId, excluir) {
  const info = infoEj(ejId), out = [];
  for (const s of getSesiones()) {
    if (s.id === excluir) continue;
    const sets = [];
    for (const it of s.items) if (it.ej === ejId) for (const x of it.series) if (x.hecho) sets.push(x);
    if (!sets.length) continue;
    let top = 0, best = 0, vol = 0;
    for (const x of sets) { top = Math.max(top, Number(x.peso) || 0); best = Math.max(best, metrica(info, x)); vol += (Number(x.peso) || 0) * (Number(x.reps) || 0); }
    out.push({ sesionId: s.id, fecha: s.fecha, inicio: s.inicio, sets, top, best, vol });
  }
  return out.sort((a, b) => (a.inicio < b.inicio ? -1 : a.inicio > b.inicio ? 1 : 0));
}
/* Progresión doble: si completas las reps meta en todas las series con el peso más alto, toca subir. */
function sugerencia(ejId, meta, excluir) {
  const info = infoEj(ejId);
  if (info.tipo === 'tiempo' || info.tipo === 'cardio') return null;
  const h = historial(ejId, excluir);
  if (!h.length) return null;
  const ult = h[h.length - 1], objetivo = meta || DEF[info.tipo].reps;
  const enTop = ult.sets.filter((x) => (Number(x.peso) || 0) === ult.top);
  const todas = enTop.every((x) => (Number(x.reps) || 0) >= objetivo);
  if (info.tipo === 'corporal' && ult.top === 0) {
    return todas ? { tipo: 'sube', peso: 0, texto: `Lograste ${objetivo} reps en todas: intenta ${objetivo + 1} o agrega lastre.` } : { tipo: 'repite', peso: 0, texto: `Busca llegar a ${objetivo} reps en todas las series.` };
  }
  if (todas && info.inc > 0) return { tipo: 'sube', peso: ult.top + info.inc, texto: `Sube a ${kg(ult.top + info.inc)} kg: la última vez completaste ${objetivo} reps en todas.` };
  const lejos = (sets, top) => sets.filter((x) => (Number(x.peso) || 0) === top).some((x) => (Number(x.reps) || 0) <= objetivo - 2);
  if (lejos(ult.sets, ult.top)) {
    const prev = h[h.length - 2];
    if (prev && prev.top === ult.top && lejos(prev.sets, prev.top) && info.inc > 0) {
      const p = Math.max(0, Math.round((ult.top * 0.9) / info.inc) * info.inc);

}
function planInicial(item) {

function mejorAntes(ejId, s, hastaK, hastaI) {

  s.items.forEach((it, k) => {

    it.series.forEach((x, i) => { if (x.hecho && (k < hastaK || (k === hastaK && i < hastaI))) best = Math.max(best, metrica(info, x)); });

}

  const lunesHoy = lunesDe(hoyISO()), porSemana = new Map();
  for (const s of getSesiones()) {

    const l = lunesDe(s.fecha);
    if (!porSemana.has(l)) porSemana.set(l, new Set());
    porSemana.get(l).add(s.fecha);

  const out = [];
  for (let i = n - 1; i >= 0; i--) { const l = sumarDias(lunesHoy, -7 * i); out.push({ lunes: l, dias: porSemana.has(l) ? porSemana.get(l).size : 0 }); }

}

function discos(total, barra) {

function marcarSerie(k, i) {

  if (!s || !s.items[k] || !s.items[k].series[i]) return;
  const it = s.items[k], x = it.series[i], info = infoEj(it.ej);
  if (!x.hecho) {

    if (!(reps >= 1) || !(peso >= 0) || (CAMPOS[info.tipo].p && info.tipo !== 'corporal' && info.tipo !== 'cardio' && (x.peso === null || x.peso === undefined))) {
      toast(`Escribe ${CAMPOS[info.tipo].p ? 'el peso y ' : ''}${info.tipo === 'tiempo' ? 'los segundos' : info.tipo === 'cardio' ? 'los minutos' : 'las repeticiones'} antes de marcar.`);

let actx = null, wakeLock = null;

function pitido() {
  if (!actx) return;
  try {
    [0, 0.22].forEach((t) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + t;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.start(t0); o.stop(t0 + 0.18);
    });
  } catch (e) { /* sin sonido */ }
}

  if (!el) return;

  if (el.hidden) { el.hidden = false; document.documentElement.style.setProperty('--timer-h', '84px'); }
  const rest = Math.max(0, S.timer.end - Date.now()), seg = Math.ceil(rest / 1000);
  $('#timer-num').textContent = mmss(seg);
  $('#timer-label').textContent = rest > 0 ? 'Descanso' : 'A la siguiente serie';
  $('#timer-fill').style.width = `${Math.min(100, (1 - rest / (S.timer.total * 1000)) * 100)}%`;
  el.classList.toggle('listo', rest === 0);

function niceTicks(lo, hi, n) {

  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag, out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}
function svgSemanas(datos, meta) {

  const maxY = Math.max(meta + 1, 5, ...datos.map((d) => d.dias)), y = (v) => pt + ih - (v / maxY) * ih, bw = iw / datos.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Días entrenados por semana en las últimas ${datos.length} semanas">`;
  for (let v = 0; v <= maxY; v += 2) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${pl - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v}</text>`;
  datos.forEach((d, i) => {
    const w = bw * 0.6, x = pl + i * bw + (bw - w) / 2, fill = d.dias >= meta ? 'var(--ok)' : d.dias === meta - 1 ? 'var(--warn)' : 'var(--ink-3)';
    if (d.dias > 0) s += `<rect x="${x.toFixed(1)}" y="${y(d.dias).toFixed(1)}" width="${w.toFixed(1)}" height="${(pt + ih - y(d.dias)).toFixed(1)}" rx="3" fill="${fill}"/><text class="val" x="${(x + w / 2).toFixed(1)}" y="${(y(d.dias) - 4).toFixed(1)}" text-anchor="middle">${d.dias}</text>`;
    s += `<text class="ax" x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${fCorta(d.lunes)}</text>`;
  });
  s += `<line x1="${pl}" x2="${W - pr}" y1="${y(meta).toFixed(1)}" y2="${y(meta).toFixed(1)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/><text class="meta-t" x="${W - pr}" y="${(y(meta) - 4).toFixed(1)}" text-anchor="end">meta ${meta}</text>`;
  return s + '</svg>';
}
function svgLinea(pts, unidad) {
  const W = 320, H = 168, pl = 38, pr = 14, pt = 22, pb = 22, iw = W - pl - pr, ih = H - pt - pb;
  let lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v));
  if (hi - lo < 5) { lo -= 2.5; hi += 2.5; }
  const tk = niceTicks(Math.max(0, lo), hi, 4); lo = tk[0]; hi = tk[tk.length - 1];
  const x = (i) => (pts.length === 1 ? pl + iw / 2 : pl + (i / (pts.length - 1)) * iw), y = (v) => pt + ih - ((v - lo) / (hi - lo || 1)) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del ejercicio">`;
  for (const v of tk) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${pl - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${kg(v)}</text>`;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  if (pts.length > 1) {
    s += `<path d="${d} L${x(pts.length - 1).toFixed(1)} ${pt + ih} L${x(0).toFixed(1)} ${pt + ih} Z" fill="var(--accent)" fill-opacity=".12" stroke="none"/>`;
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p, i) => { const last = i === pts.length - 1; s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 5 : 2.6}" fill="${last ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`; });
  const lx = x(pts.length - 1), ly = y(pts[pts.length - 1].v), ty = ly - 10 < 14 ? ly + 20 : ly - 10;
  s += `<text class="val" x="${Math.min(lx, W - pr).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="end">${kg(pts[pts.length - 1].v)} ${unidad}</text>`;
  s += `<text class="ax" x="${pl}" y="${H - 6}" text-anchor="start">${fCorta(pts[0].fecha)}</text>`;
  if (pts.length > 1) s += `<text class="ax" x="${W - pr}" y="${H - 6}" text-anchor="end">${fCorta(pts[pts.length - 1].fecha)}</text>`;
  return s + '</svg>';
}

/* ================= Vistas ================= */
function encabezado() {
  const hoy = hoyISO(), lunes = lunesDe(hoy), dias = diasEntrenados(), plan = planDias(), meta = S.ajustes.metaSemanal;
  let n = 0;
  const celdas = DIAS.map((l, i) => {
    const f = sumarDias(lunes, i), on = dias.has(f), p = plan[i];
    if (on) n++;
    const cls = on ? 'on' : p === 'descanso' ? 'descanso' : p ? 'plan' : '';
    const r = p && p !== 'descanso' ? rutinaDe(p) : null;
    const desc = `${DIAS_LARGO[i]}${on ? ': entrenaste' : r ? `: ${r.nombre}` : p === 'descanso' ? ': descanso' : ''}`;
    return `<li class="dia ${cls}${f === hoy ? ' hoy' : ''}" aria-label="${esc(desc)}" title="${esc(desc)}"><span class="disco"></span><span class="dl">${l}</span></li>`;
  }).join('');
  const est = n > meta ? ['extra', 'Semana extra'] : n === meta ? ['ok', 'Meta cumplida'] : n === meta - 1 ? ['casi', 'Te falta 1'] : ['falta', `Te faltan ${meta - n}`];
  const act = sesionActiva();
  const volver = act && (S.tab !== 'hoy' || S.vista) ? `<button class="volver" data-action="tab" data-tab="hoy"><span>Entrenando: ${esc(act.rutinaNombre)}</span><span aria-hidden="true">Volver →</span></button>` : '';
  return `<div class="head-row"><span class="eyebrow">Bitácora de Fuerza</span><button class="icon-btn" data-action="ajustes" aria-label="Ajustes">⚙</button></div>
    <div class="semana"><div class="sem-izq"><div class="sem-num"><span class="num big">${n}</span><span class="num de">/ ${meta}</span></div><span class="pill pill-${est[0]}">${est[1]}</span></div><ol class="dias" aria-label="Esta semana">${celdas}</ol></div>${volver}`;
}

function listaEjerciciosRutina(r) {
  if (!r.items.length) return '<p class="muted small">Sin ejercicios todavía.</p>';
  return `<ul class="ej-lista">${r.items.map((it) => { const info = infoEj(it.ej); return `<li><span>${esc(info.nombre)}</span><span class="num">${it.series} × ${it.reps}${info.tipo === 'tiempo' ? ' s' : info.tipo === 'cardio' ? ' min' : ''}</span></li>`; }).join('')}</ul>`;
}

function resumenSesionHTML(s, titulo) {
  const filas = s.items.map((it) => {
    const info = infoEj(it.ej), hechas = it.series.filter((x) => x.hecho);
    if (!hechas.length) return '';
    const mejor = hechas.reduce((b, x) => (metrica(info, x) > metrica(info, b) ? x : b), hechas[0]);
    return `<li><span>${esc(info.nombre)}</span><span class="num">${hechas.length} ${hechas.length === 1 ? 'serie' : 'series'} · mejor ${fmtSet(info, mejor)}</span></li>`;
  }).join('');
  return `<article class="card"><header><span class="eyebrow">${esc(titulo)} · ${fCorta(s.fecha)}</span><h3>${esc(s.rutinaNombre)}</h3><p class="muted small">${hechasDe(s)} series</p></header><ul class="ej-lista">${filas}</ul></article>`;
}

function vistaHoy() {
  const s = sesionActiva();
  if (s) return vistaSesion(s);
  const hoy = hoyISO(), idx = diaIdx(hoy), plan = planDias(), p = plan[idx], r = p && p !== 'descanso' ? rutinaDe(p) : null;
  const hechasHoy = getSesiones().filter((x) => x.fecha === hoy && x.estado !== 'en_curso' && hechasDe(x));
  let h = `<section class="stack"><div class="section-head"><span class="eyebrow">Hoy</span><h2 class="cap">${esc(fLarga(hoy))}</h2></div>` + avisosApp();
  const sinNada = plan.every((x) => !x) && !rutinasTodas().length;
  if (sinNada) {
    h += `<article class="card destacada"><h3>Arma tu semana en 3 pasos</h3><ol class="pasos"><li>Ve a <b>Semana</b> y toca un día (por ejemplo, el lunes).</li><li>Ponle nombre («Pecho + Tríceps + Hombro») y elige los ejercicios de la biblioteca.</li><li>Ese día vuelve aquí y toca <b>Empezar</b>: las series aparecen listas y solo marcas ✓.</li></ol><div class="row"><button class="btn primary" data-action="tab" data-tab="semana">Armar mi semana</button><button class="btn ghost" data-action="start" data-rutina="">Entrenamiento libre</button></div></article>`;
  } else if (hechasHoy.length) {
    h += `<article class="card destacada"><h3>✓ Hoy ya entrenaste</h3><p class="muted">Buen trabajo. Si quieres hacer algo más, elige qué.</p><button class="btn" data-action="elegir">Entrenar algo más</button></article>`;
    h += resumenSesionHTML(hechasHoy[0], 'Hoy');
  } else if (r) {
    h += `<article class="card destacada"><header><span class="eyebrow">Te toca hoy</span><h3>${esc(r.nombre)}</h3></header>${listaEjerciciosRutina(r)}<button class="btn primary big" data-action="start" data-rutina="${r.id}"${r.items.length ? '' : ' disabled'}>Empezar</button>${r.items.length ? '' : `<button class="btn link" data-action="abrir-dia" data-dia="${idx}">Agregar ejercicios a este día</button>`}<button class="btn link" data-action="elegir">Entrenar otra cosa</button></article>`;
  } else if (p === 'descanso') {
    h += `<article class="card destacada"><h3>Hoy toca descanso</h3><p class="muted">Recuperarte también es parte de ganar fuerza.</p><button class="btn" data-action="elegir">Igual quiero entrenar</button></article>`;
  } else {
    h += `<article class="card destacada"><h3>Hoy no tienes nada planificado</h3><p class="muted">Elige qué entrenar o deja listo el ${DIAS_LARGO[idx].toLowerCase()} en tu semana.</p><div class="row"><button class="btn primary" data-action="elegir">Elegir qué entrenar</button><button class="btn ghost" data-action="abrir-dia" data-dia="${idx}">Planificar el ${DIAS_LARGO[idx].toLowerCase()}</button></div></article>`;
  }
  if (!sinNada && !hechasHoy.length) {
    const pend = pendientesSemana();
    if (pend.length) h += `<article class="card"><header><h3>Te quedó pendiente</h3><p class="muted small">Si faltaste un día, puedes hacerlo hoy.</p></header><ul class="ej-lista">${pend.map((x) => `<li><span><b>${DIAS_LARGO[x.dia]}</b> · ${esc(x.r.nombre)}</span><button class="btn small" data-action="start" data-rutina="${x.r.id}">Hacer hoy</button></li>`).join('')}</ul></article>`;
  }
  const ultima = getSesiones().find((x) => x.estado !== 'en_curso' && hechasDe(x) && x.fecha !== hoy);
  if (ultima) h += resumenSesionHTML(ultima, 'Último entrenamiento');

function htmlDiscos(s, k) {
  const it = s.items[k]; if (!it) return '';
  const fila = it.series.find((x) => !x.hecho) || it.series[it.series.length - 1];
  const total = fila ? Number(fila.peso) : NaN, barra = S.ajustes.barraKg || 20;
  if (!(total > 0)) return '';
  if (!(total > barra)) return `<span class="small">${total === barra ? 'Solo la barra' : `Menos que la barra (${kg(barra)} kg)`}</span>`;
  const d = discos(total, barra);
  return `<span class="plates" aria-hidden="true"><span class="sleeve"></span>${d.lista.map((p) => `<span class="plate" style="--h:${PLATE_H[p] || 20}px;--c:var(${PLATE_VAR[p] || '--plate-1'})"></span>`).join('')}</span>
    <span class="small">${kg(total)} kg → por lado: <b class="num">${d.lista.map(kg).join(' + ')}</b>${d.resto ? ` <span class="muted">(no cuadra exacto: quedan ${kg(d.resto * 2)} kg)</span>` : ''}</span>`;
}
function actualizarDiscos(k) { const s = sesionActiva(), box = document.getElementById('discos-' + k); if (s && box) box.innerHTML = htmlDiscos(s, k); }

function vistaSesion(s) {
  const hechas = hechasDe(s), total = totalDe(s);
  let h = `<section class="stack"><header class="sesion-head"><div><span class="eyebrow">Entrenando · <span id="dur">0 min</span></span><h2>${esc(s.rutinaNombre)}</h2></div><p class="sesion-prog"><span class="num">${hechas}</span> / <span class="num">${total}</span> series</p></header>`;
  if (!s.items.length) h += '<article class="card"><p class="muted">Todavía no hay ejercicios en este entrenamiento.</p></article>';
  h += s.items.map((it, k) => tarjetaItem(s, it, k)).join('');
  h += '<button class="btn big" data-action="abrir-biblioteca" data-ctx="sesion">+ Agregar ejercicio</button>';
  if (S.confirm === 'finish') {
    const faltan = total - hechas;
    h += `<div class="fin card"><p>${faltan ? `Te quedan ${faltan} series sin marcar: no se guardan. ` : ''}¿Terminar y guardar?</p><div class="row"><button class="btn primary" data-action="finish-ok">Sí, terminar</button><button class="btn ghost" data-action="cancel">Seguir entrenando</button></div></div>`;
  } else if (S.confirm === 'discard') {
    h += `<div class="fin card"><p>Se borrará este entrenamiento${hechas ? ` y sus ${hechas} series hechas` : ''}.</p><div class="row"><button class="btn danger" data-action="discard-ok">Borrar entrenamiento</button><button class="btn ghost" data-action="cancel">Cancelar</button></div></div>`;
  } else {
    h += '<div class="fin"><button class="btn primary big" data-action="finish">Terminar entrenamiento</button><button class="btn link" data-action="discard">Descartar este entrenamiento</button></div>';
  }
  return h + '</section>';
}

function vistaSemana() {
  const plan = planDias(), hoyI = diaIdx(hoyISO()), lunes = lunesDe(hoyISO()), dias = diasEntrenados();

  plan.forEach((p, i) => {
    const r = p && p !== 'descanso' ? rutinaDe(p) : null, hecho = dias.has(sumarDias(lunes, i));

    h += `<li><button class="dia-btn${i === hoyI ? ' hoy' : ''}" data-action="abrir-dia" data-dia="${i}"><span class="dia-n">${DIAS_LARGO[i]}</span><span class="dia-r"><b>${esc(titulo)}</b><small>${hecho ? '✓ Entrenado esta semana · ' : ''}${i === hoyI ? 'Hoy · ' : ''}${esc(sub)}</small></span><span class="chev" aria-hidden="true">›</span></button></li>`;

}

function vistaProgreso() {
  const con = getSesiones().filter((s) => hechasDe(s)), meta = S.ajustes.metaSemanal;

  const ejs = ejerciciosConHistorial().filter((e) => e.tipo !== 'cardio');
  if (ejs.length) {
    if (!S.progEj || !ejs.some((e) => e.id === S.progEj)) S.progEj = ejs[0].id;
    const sel = infoEj(S.progEj), hist = historial(sel.id), pts = hist.slice(-24).map((x) => ({ fecha: x.fecha, v: x.best }));
    const pesas = ['barra', 'mancuernas', 'maquina'].includes(sel.tipo);

    h += `<article class="card"><header><h3>Fuerza por ejercicio</h3><p class="muted small">${pesas ? '1RM estimado (fórmula de Epley): el peso que podrías levantar una vez, según tu mejor serie de cada día.' : 'Tu mejor serie de cada día.'}</p></header>
      <div class="chips" role="group" aria-label="Elegir ejercicio">${ejs.map((e) => `<button class="chip" data-action="prog-ej" data-ej="${e.id}" aria-pressed="${e.id === sel.id}">${esc(e.nombre)}</button>`).join('')}</div>
      <div class="chart">${svgLinea(pts, unidad)}</div>
      ${mejor ? `<p class="small">Mejor marca: <b class="num">${fmtSet(sel, mejor.st)}</b> el ${fCorta(mejor.fecha)}${pesas ? ` · 1RM estimado <b class="num">${kg(mejor.v)} kg</b>` : ''}</p>` : ''}
      <div class="tabla-wrap"><table class="tabla"><thead><tr><th>Fecha</th><th>Series</th></tr></thead><tbody>${hist.slice(-6).reverse().map((x) => `<tr><td>${fCorta(x.fecha)}</td><td class="num">${x.sets.map((st) => fmtSet(sel, st)).join(' · ')}</td></tr>`).join('')}</tbody></table></div></article>`;

function itemHistorial(s) {

/* ================= Render ================= */
function capturar() {
  const ae = document.activeElement;
  const foco = ae && ae.id && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) ? ae.id : null;
  const vals = {};
  document.querySelectorAll('#vista [data-keep]').forEach((el) => { if (el.id) vals[el.id] = el.value; });
  return { foco, vals };
}
function restaurar(k) {
  for (const [id, v] of Object.entries(k.vals)) { const el = document.getElementById(id); if (el) el.value = v; }
  if (k.foco) { const el = document.getElementById(k.foco); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}
function renderSheet() {
  const el = $('#sheet');
  if (!S.sheet) { el.hidden = true; el.innerHTML = ''; document.documentElement.classList.remove('lock'); return; }
  el.hidden = false; el.innerHTML = sheetHTML(); document.documentElement.classList.add('lock');
  const t = $('#sheet-t'); if (t) t.focus({ preventScroll: true });
}
function render() {
  const keep = capturar();
  $('#top').innerHTML = encabezado();
  const aviso = $('#aviso');
  if (S.sinDb) { aviso.hidden = false; aviso.textContent = 'Este navegador no deja guardar datos (por ejemplo, en modo incógnito). Ábrela en una ventana normal para registrar tus series.'; }
  else if (S.soloLectura) { aviso.hidden = false; aviso.textContent = 'Estás viendo esta bitácora sin permiso para editarla.'; }
  else aviso.hidden = true;
  const cargando = !S.sinDb && (!S.db || !(S.cargado.ejercicios && S.cargado.rutinas && S.cargado.sesiones && S.cargado.plan));
  let html;
  if (cargando) html = '<p class="muted cargando">Cargando tu bitácora…</p>';
  else if (S.vista && S.vista.tipo === 'ajustes') html = vistaAjustes();
  else if (S.vista && S.vista.tipo === 'dia') html = vistaDia(S.vista.dia);
  else if (S.tab === 'semana') html = vistaSemana();
  else if (S.tab === 'progreso') html = vistaProgreso();
  else html = vistaHoy();
  $('#vista').innerHTML = html;
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.tab === S.tab && !(S.vista && S.vista.tipo === 'ajustes') ? 'page' : 'false'));
  restaurar(keep);
  if (S.sheetDirty) { S.sheetDirty = false; renderSheet(); }
  tick();
}
function irA(tab) {
  if (!TABS.includes(tab)) return;
  S.tab = tab; S.vista = null; S.confirm = null; S.menuEj = null;
  guardarLocal('bf-tab', tab);
  try { history.replaceState(null, '', '#' + tab); } catch (e) { /* sin historial */ }
  render(); window.scrollTo({ top: 0 });
}
function cerrarSheet() { S.sheet = null; S.sheetDirty = true; render(); }

/* ================= Eventos ================= */
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const a = b.dataset.action, id = b.dataset.id, k = Number(b.dataset.k), i = Number(b.dataset.i);
  switch (a) {
    case 'tab': irA(b.dataset.tab); break;
    case 'ajustes': S.vista = { tipo: 'ajustes' }; S.confirm = null; render(); window.scrollTo({ top: 0 }); break;
    case 'volver': S.vista = null; S.confirm = null; render(); window.scrollTo({ top: 0 }); break;
    case 'start': prepararAudio(); empezar(b.dataset.rutina || null); break;
    case 'elegir': S.sheet = { tipo: 'elegir' }; S.sheetDirty = true; render(); break;
    case 'cerrar-sheet': cerrarSheet(); break;
    case 'check': prepararAudio(); marcarSerie(k, i); break;
    case 'usar-anterior': usarAnterior(k, i); break;
    case 'agregar-serie': agregarSerie(k); break;
    case 'quitar-serie': quitarSerie(k); break;
    case 'menu-ej': { const s = sesionActiva(); const key = s ? s.id + ':' + k : null; S.menuEj = S.menuEj === key ? null : key; S.confirm = null; render(); break; }
    case 'mover-ej': moverEjercicio(k, Number(b.dataset.d)); break;
    case 'quitar-ej': { const s = sesionActiva(); if (s && s.items[k] && s.items[k].series.some((x) => x.hecho)) { S.confirm = 'quitar-ej:' + k; render(); } else quitarEjercicio(k); break; }
    case 'quitar-ej-ok': quitarEjercicio(k); break;
    case 'finish': S.confirm = 'finish'; render(); break;
    case 'discard': S.confirm = 'discard'; render(); break;
    case 'cancel': S.confirm = null; render(); break;
    case 'finish-ok': terminar(); break;
    case 'discard-ok': descartar(); break;
    case 'timer-mas': if (S.timer) { S.timer.end = Math.max(S.timer.end, Date.now()) + 30000; S.timer.total += 30; S.timer.avisado = false; guardarLocal('bf-timer', S.timer); tick(); } break;
    case 'timer-fin': S.timer = null; guardarLocal('bf-timer', null); tick(); break;
    case 'abrir-dia': S.tab = 'semana'; S.vista = { tipo: 'dia', dia: Number(b.dataset.dia) }; S.confirm = null; render(); window.scrollTo({ top: 0 }); break;
    case 'dia-entrenar': { const d = Number(b.dataset.dia); crearRutina(`Rutina del ${DIAS_LARGO[d].toLowerCase()}`, [], d); break; }
    case 'dia-descanso': setDia(Number(b.dataset.dia), 'descanso'); S.confirm = null; break;
    case 'dia-limpiar': setDia(Number(b.dataset.dia), null); S.confirm = null; break;
    case 'quitar-dia': S.confirm = 'quitar-dia:' + b.dataset.dia; render(); break;
    case 'dia-usar': { const d = Number(b.dataset.dia), sel = $('#usar-' + d); if (sel && sel.value) usarRutinaEnDia(sel.value, d); break; }
    case 'asignar': { const sel = $('#asig-' + id); if (sel) usarRutinaEnDia(id, Number(sel.value)); break; }
    case 'borrar-rutina': S.confirm = 'borrar-rutina:' + id; render(); break;
    case 'borrar-rutina-ok': borrarRutina(id); break;
    case 'item-paso': {
      const campo = b.dataset.campo, d = Number(b.dataset.d);
      mutarRutina(id, (items) => {
        const it = items[k]; if (!it) return;
        const t = infoEj(it.ej).tipo;
        if (campo === 'series') it.series = Math.max(1, Math.min(10, it.series + d));
        else { const paso = t === 'tiempo' || t === 'cardio' ? 5 : 1, max = t === 'tiempo' ? 600 : t === 'cardio' ? 180 : 50; it.reps = Math.max(1, Math.min(max, it.reps + d * paso)); }
      });
      break;
    }
    case 'item-mover': { const d = Number(b.dataset.d); mutarRutina(id, (items) => { const j = k + d; if (j >= 0 && j < items.length) [items[k], items[j]] = [items[j], items[k]]; }); break; }
    case 'item-quitar': mutarRutina(id, (items) => { items.splice(k, 1); }); break;
    case 'abrir-biblioteca': abrirBiblioteca(b.dataset.ctx === 'rutina' ? { tipo: 'rutina', rid: id } : { tipo: 'sesion' }); break;
    case 'lib-toggle': { const sh = S.sheet; if (!sh) break; if (sh.sel.has(id)) sh.sel.delete(id); else sh.sel.add(id); b.setAttribute('aria-pressed', String(sh.sel.has(id))); actualizarBotonLib(); break; }
    case 'lib-musculo': if (S.sheet) { S.sheet.musculo = b.dataset.v; actualizarListaLib(); } break;
    case 'lib-crear': if (S.sheet) { S.sheet.crear = true; S.sheetDirty = true; render(); } break;
    case 'lib-volver': if (S.sheet) { S.sheet.crear = false; S.sheetDirty = true; render(); } break;
    case 'lib-agregar': confirmarBiblioteca(); break;
    case 'prog-ej': S.progEj = b.dataset.ej; render(); break;
    case 'abrir-hist': S.abierta = S.abierta === id ? null : id; S.confirm = null; render(); break;
    case 'del-sesion': S.confirm = 'del-sesion:' + id; render(); break;

/* ================= Guardado en este dispositivo ================= */
/* Imita la base de datos que usaba la versión de Claude (doc/collection/onSnapshot), pero guarda todo en
   el navegador del celular. Cada persona que abre el link tiene sus propios datos. */
const CLAVE_DATOS = 'bf-datos-v1';
function almacenamientoDisponible() { try { localStorage.setItem('bf-prueba', '1'); localStorage.removeItem('bf-prueba'); return true; } catch (e) { return false; } }
function crearDbLocal() {
  const vacio = () => ({ ejercicios: {}, rutinas: {}, sesiones: {}, plan: {}, config: {} });
  let mem = vacio();
  const cargar = () => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(CLAVE_DATOS) || 'null'); } catch (e) { d = null; }
    mem = vacio();
    if (d && typeof d === 'object') for (const k of Object.keys(mem)) if (d[k] && typeof d[k] === 'object') mem[k] = d[k];
  };
  cargar();
  const subs = new Set();
  const avisar = () => setTimeout(() => { for (const f of subs) f(); }, 0);
  const error = (code) => Object.assign(new Error(code), { code });
  function guardar(fn) {
    const antes = JSON.stringify(mem);
    try { fn(); localStorage.setItem(CLAVE_DATOS, JSON.stringify(mem)); }
    catch (e) { mem = JSON.parse(antes); return Promise.reject(error(e && e.name === 'QuotaExceededError' ? 'quota_exceeded' : 'unavailable')); }
    avisar();
    return Promise.resolve();
  }
  function escuchar(f) { subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }
  function doc(path) {
    const [col, id] = String(path).split('/');
    return {
      set: (data) => guardar(() => { (mem[col] = mem[col] || {})[id] = clonar(data); }),
      update: (data) => guardar(() => { (mem[col] = mem[col] || {})[id] = { ...(mem[col][id] || {}), ...clonar(data) }; }),
      delete: () => guardar(() => { if (mem[col]) delete mem[col][id]; }),
      onSnapshot: (cb) => escuchar(() => {
        const d = mem[col] && mem[col][id];
        cb({ id, exists: !!d, data: () => (d ? clonar(d) : undefined), metadata: { hasPendingWrites: false } });
      }),
    };
  }
  function collection(col) {
    let orden = null, max = Infinity;
    const q = {
      orderBy(field, dir) { orden = { field, signo: dir === 'desc' ? -1 : 1 }; return q; },
      limit(n) { max = n; return q; },
      onSnapshot: (cb) => escuchar(() => {
        const docs = Object.entries(mem[col] || {}).map(([id, d]) => ({ id, d }));
        if (orden) docs.sort((a, b) => { const x = String(a.d[orden.field] || ''), y = String(b.d[orden.field] || ''); return (x < y ? -1 : x > y ? 1 : 0) * orden.signo; });
        cb({ docs: docs.slice(0, max).map(({ id, d }) => ({ id, data: () => clonar(d) })), metadata: { hasPendingWrites: false } });
      }),
    };
    return q;
  }
  window.addEventListener('storage', (e) => { if (e.key === CLAVE_DATOS) { cargar(); avisar(); } });
  return {
    doc, collection,
    exportar: () => clonar(mem),
    reemplazar: (datos) => guardar(() => {
      const n = vacio();
      for (const k of Object.keys(n)) if (datos[k] && typeof datos[k] === 'object') n[k] = clonar(datos[k]);
      mem = n;
    }),
  };
}

async function bajarRespaldo() {

  const nombre = `bitacora-fuerza-${hoyISO()}.json`;

    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [archivo] })) {

  if (!d || typeof d !== 'object' || !['sesiones', 'rutinas', 'ejercicios', 'plan', 'config'].some((k) => d[k] && typeof d[k] === 'object')) return null;

/* ================= Compartir una rutina con un amigo ================= */
function aB64(txt) { let s = ''; new TextEncoder().encode(txt).forEach((b) => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function deB64(code) { const s = atob(code.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(s, (c) => c.charCodeAt(0))); }
const linkBase = () => location.origin + location.pathname;
async function compartirRutina(rid) {
  const r = rutinaDe(rid);
  if (!r || !r.items.length) return;
  const propios = {};
  for (const it of r.items) if (S.ejercicios.has(it.ej)) { const i = infoEj(it.ej); propios[it.ej] = { nombre: i.nombre, musculo: i.musculo, tipo: i.tipo }; }
  const datos = { v: 1, n: r.nombre, i: r.items.map(({ ej, series, reps, descanso }) => ({ ej, series, reps, descanso })), e: propios };
  const url = linkBase() + '#r=' + aB64(JSON.stringify(datos));
  const texto = `Te paso mi rutina «${r.nombre}» para la Bitácora de Fuerza. Abre el link y toca «Agregar a mis rutinas»:`;
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ title: r.nombre, text: texto, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  S.sheet = { tipo: 'link', url, nombre: r.nombre }; S.sheetDirty = true; render();
}
async function copiarLink() {

function leerRutinaCompartida(code) {
  try {
    const d = JSON.parse(deB64(code));
    if (!d || !Array.isArray(d.i) || !d.i.length) return null;
    const items = d.i.filter((x) => x && /^[a-z0-9-]{1,60}$/i.test(String(x.ej))).slice(0, 40).map((x) => ({
      ej: String(x.ej), series: Math.max(1, Math.min(10, Number(x.series) || 3)),
      reps: Math.max(1, Math.min(600, Number(x.reps) || 10)), descanso: Math.max(0, Math.min(600, Number(x.descanso) || 0)),
    }));
    if (!items.length) return null;
    return { nombre: String(d.n || 'Rutina compartida').slice(0, 60), items, propios: d.e && typeof d.e === 'object' ? d.e : {} };
  } catch (e) { return null; }
}
const nombreCompartido = (r, ej) => (LIB_MAP.has(ej) || S.ejercicios.has(ej) ? infoEj(ej).nombre : String((r.propios[ej] && r.propios[ej].nombre) || 'Ejercicio').slice(0, 60));
function sheetRutinaCompartida(sh) {

  return `<div class="sheet-wrap"><button class="sheet-bg" data-action="cerrar-sheet" aria-label="Cerrar"></button><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">

  </section></div>`;
}
async function agregarRutinaCompartida() {
  const sh = S.sheet;
  if (!sh || sh.tipo !== 'rutina-compartida') return;
  const { nombre, items, propios } = sh.rutina;
  for (const it of items) {
    if (LIB_MAP.has(it.ej) || S.ejercicios.has(it.ej)) continue;
    const p = propios[it.ej] || {}, musculo = MUSCULO_NOMBRE[p.musculo] ? p.musculo : 'otro', tipo = TIPOS[p.tipo] ? p.tipo : 'maquina';
    const body = { nombre: String(p.nombre || 'Ejercicio').slice(0, 60), musculo, tipo, inc: defInc(tipo, musculo), creado: new Date().toISOString() };
    S.ejercicios.set(it.ej, body);
    await escribir('ejercicios/' + it.ej, () => S.db.doc('ejercicios/' + it.ej).set(body));
  }
  S.sheet = null; S.sheetDirty = true;
  await crearRutina(nombre, items);
  irA('semana');
  toast(`Rutina «${nombre}» agregada. Asígnala a un día más abajo, en «Rutinas guardadas sin día».`);

/* ================= Conexión con el guardado ================= */
async function conectar() {
  if (!almacenamientoDisponible()) { S.sinDb = true; render(); return; }
  const db = crearDbLocal();
  S.db = db;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* sin persistencia */ }
  const alError = (e) => { if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) { S.sinDb = true; S.db = null; } render(); };
  db.collection('ejercicios').onSnapshot((snap) => {
    const m = new Map(snap.docs.map((d) => [d.id, d.data()]));
    for (const [id, v] of S.ejercicios) if (!m.has(id) && snap.metadata.hasPendingWrites) m.set(id, v);
    S.ejercicios = m; S.cargado.ejercicios = true; bump(); render();
  }, alError);
  db.collection('rutinas').onSnapshot((snap) => {
    S.rutinasRaw = new Map(snap.docs.map((d) => [d.id, d.data()]));
    if (!snap.metadata.hasPendingWrites) limpiarPend('rutinas/');
    S.cargado.rutinas = true; bump(); render();
  }, alError);
  db.collection('sesiones').orderBy('inicio', 'desc').limit(500).onSnapshot((snap) => {
    S.sesionesRaw = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.hasPendingWrites) limpiarPend('sesiones/');
    S.cargado.sesiones = true; bump(); render();
    if (sesionActiva()) pedirWakeLock();
  }, alError);
  db.doc('plan/semana').onSnapshot((snap) => {
    S.planRaw = snap.exists ? snap.data() : null;
    if (!snap.metadata.hasPendingWrites) limpiarPend('plan/');
    S.cargado.plan = true; render();
  }, alError);
  db.doc('config/ajustes').onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : {};
    S.ajustes = { ...DEFAULTS, ...d, discos: Array.isArray(d.discos) && d.discos.length ? d.discos : DEFAULTS.discos };
    render();
  }, alError);
}

function start(data) {
  const guardada = leerLocal('bf-tab');
  if (TABS.includes(guardada)) S.tab = guardada;
  const hash = (location.hash || '').replace('#', '');
  if (TABS.includes(hash)) S.tab = hash;
  if (data && TABS.includes(data.tab)) S.tab = data.tab;
  const tm = (data && data.timer) || leerLocal('bf-timer');
  if (tm && tm.end > Date.now() - 60000) S.timer = tm;
  render(); setInterval(tick, 250);
  conectar();
  revisarLinkEntrante();
  registrarSW();
}

start({});
})();
</script>
